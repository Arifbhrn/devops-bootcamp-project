---
services:
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file: .env
    command: tunnel run
    restart: unless-stopped

volumes:
  grafana-data:
