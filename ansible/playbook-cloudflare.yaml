---
- name: Connect monitor host via Cloudflare Tunnel
  hosts: monitor
  become: true
  vars:
    tunnel_parameter: "/devops-bootcamp-project/tunnel-token"

  tasks:
    - name: Install unzip
      apt:
        name: unzip
        state: present
        update_cache: true

    - name: Install AWS CLI v2
      block:
        - name: Download AWS CLI installer
          get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            dest: /tmp/awscliv2.zip
        - name: Unzip AWS CLI installer
          unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: true
        - name: Run AWS CLI installer
          command: /tmp/aws/install
          args:
            creates: /usr/local/bin/aws

    - name: Fetch Cloudflare tunnel token from SSM
      command: >-
        aws ssm get-parameter --name {{ tunnel_parameter }}
        --with-decryption --query Parameter.Value --output text
      changed_when: false
      register: tunnel_token

    - name: Run cloudflared container
      community.docker.docker_container:
        name: cloudflared
        image: cloudflare/cloudflared:latest
        state: started
        restart_policy: unless-stopped
        env:
          TUNNEL_TOKEN: "{{ tunnel_token.stdout }}"
        command: tunnel run